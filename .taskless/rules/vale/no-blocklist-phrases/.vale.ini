# Scoped to READMEs. Broadening to source comments, recipe text, and openspec
# is a separate decision with a large remediation attached.
[**/README.md]
tskl) rule = no-blocklist-phrases
BasedOnStyles =
no-blocklist-phrases.no-blocklist-phrases = YES

# Agent-facing instructions and the house conventions. Read as often as the
# READMEs are, by both people and agents, and small enough to keep conforming.
[CLAUDE.md]
tskl) rule = no-blocklist-phrases
BasedOnStyles =
no-blocklist-phrases.no-blocklist-phrases = YES

[.conventions/*.md]
tskl) rule = no-blocklist-phrases
BasedOnStyles =
no-blocklist-phrases.no-blocklist-phrases = YES

# Test fixtures are inputs to the CLI's own suite, not documentation.

# Agent-facing recipe text. Read by an agent on every authoring run, and the
# surface where a lapse propagates into generated rules, so it is held to the
# same standard as the docs a person reads.
#
# These are `.txt`, which Vale treats as PLAIN TEXT: there is no markdown
# parser, so fenced blocks and code spans are not skipped the way they are in
# a `.md` file. Everything in the file is prose as far as the rule is
# concerned, including command examples.
[packages/cli/src/agent/*.txt]
tskl) rule = no-blocklist-phrases
BasedOnStyles =
no-blocklist-phrases.no-blocklist-phrases = YES

[**/test/fixtures/**/README.md]
tskl) rule = no-blocklist-phrases
BasedOnStyles =
no-blocklist-phrases.no-blocklist-phrases = NO
