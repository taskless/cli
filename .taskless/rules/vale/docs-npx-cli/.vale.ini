# READMEs are read by external consumers, who do not have this repo's scripts.
# CLAUDE.md and .conventions/ deliberately document the local `pnpm cli` path.
#
# There is no per-case escape hatch for this rule, and that is a property of its
# scope rather than an oversight. `scope: [raw, ...]` in the rule is what reaches
# a fenced code block at all, and Vale evaluates a raw scope against the
# unparsed markup, so its in-file directives never apply: measured on Vale
# 3.18.0, both `<!-- vale docs-npx-cli.docs-npx-cli = NO -->` and a blanket
# `<!-- vale off -->` are ignored here, while dropping `raw` makes both work and
# costs every fenced-block finding. A document that has to describe the local
# script therefore names it (see the root README) instead of reproducing the
# invocation, and the rule keeps its full reach.
[**/README.md]
tskl) rule = docs-npx-cli
BasedOnStyles =
docs-npx-cli.docs-npx-cli = YES

# Test fixtures are inputs to the CLI's own suite, not documentation.
[**/test/fixtures/**/README.md]
tskl) rule = docs-npx-cli
BasedOnStyles =
docs-npx-cli.docs-npx-cli = NO
