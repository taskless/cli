extends: existence
message: "Run '%s' through the project launcher, ./.taskless/bin/cli.mjs. npx and pnpm dlx only install or upgrade: bare, or with init"
level: error
ignorecase: false
nonword: true
scope: [raw, code, text]
tokens:
  # Every subcommand but `init`, listed rather than matched as "any word that
  # is not init", so prose such as "run npx @taskless/cli to install" passes.
  - '\b(?:npx|pnpm dlx|yarn dlx|bunx) @taskless/cli(?:-nightly)?(?:@[\w.-]+)? +(?:agent|auth|check|demo|detect|feedback|help|info|onboard|report|rule|share|test|update|validate|verify)\b'
  - '\bpnpm cli\b'
