extends: existence
message: "Run '%s' through the project launcher, ./.taskless/bin/cli.mjs. npx and pnpm dlx only install, upgrade, or log in: bare, init, or auth"
level: error
ignorecase: false
nonword: true
scope: [raw, code, text]
tokens:
  # Every subcommand in packages/cli/src/commands/names.ts but `init` and
  # `auth`, listed rather than matched as "any word that is not init", so prose
  # such as "run npx @taskless/cli to install" passes. `auth` is allowed
  # because a login is a per-repo token, not a version: the CLI runs it on any
  # version.
  - '\b(?:npx|pnpm dlx|yarn dlx|bunx) @taskless/cli(?:-nightly)?(?:@[\w.-]+)? +(?:agent|check|detect|feedback|info|onboard|report|rule|share|update|validate|verify)\b'
  - '\bpnpm cli\b'
