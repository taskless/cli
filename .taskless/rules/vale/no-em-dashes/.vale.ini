# Scoped to READMEs, where the repository is already clean. Broadening this
# to source comments and openspec is a separate, much larger decision.
[**/README.md]
tskl) rule = no-em-dashes
BasedOnStyles =
no-em-dashes.no-em-dashes = YES

# Agent-facing instructions and the house conventions. Read as often as the
# READMEs are, by both people and agents, and small enough to keep conforming.
[CLAUDE.md]
tskl) rule = no-em-dashes
BasedOnStyles =
no-em-dashes.no-em-dashes = YES

[.conventions/*.md]
tskl) rule = no-em-dashes
BasedOnStyles =
no-em-dashes.no-em-dashes = YES

# Test fixtures are inputs to the CLI's own suite, not documentation.
[**/test/fixtures/**/README.md]
tskl) rule = no-em-dashes
BasedOnStyles =
no-em-dashes.no-em-dashes = NO
