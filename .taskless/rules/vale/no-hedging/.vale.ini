# Prose docs a reader outside the team will hit. Code spans and fenced
# blocks are not prose, so this rule never sees a command or an identifier.
[**/README.md]
tskl) rule = no-hedging
BasedOnStyles =
no-hedging.no-hedging = YES

[.conventions/*.md]
tskl) rule = no-hedging
BasedOnStyles =
no-hedging.no-hedging = YES

# Test fixtures are inputs to the CLI's own suite, not documentation.
[**/test/fixtures/**/README.md]
tskl) rule = no-hedging
BasedOnStyles =
no-hedging.no-hedging = NO
