# Prose docs a reader outside the team will hit. Code spans and fenced
# blocks are not prose, so this rule never sees a command or an identifier.
[**/README.md]
tskl) rule = no-hedging
BasedOnStyles =
no-hedging.no-hedging = YES

[CLAUDE.md]
tskl) rule = no-hedging
BasedOnStyles =
no-hedging.no-hedging = YES

[.conventions/*.md]
tskl) rule = no-hedging
BasedOnStyles =
no-hedging.no-hedging = YES
[packages/cli/src/agent/*.md]
tskl) rule = no-hedging
BasedOnStyles =
no-hedging.no-hedging = YES


# Test fixtures are inputs to the CLI's own suite, not documentation.

# Agent-facing recipe text. Read by an agent on every authoring run, and the
# surface where a lapse propagates into generated rules, so it is held to the
# same standard as the docs a person reads.
#
# These are `.txt`, which Vale treats as PLAIN TEXT: there is no markdown
# parser, so fenced blocks and code spans are not skipped the way they are in
# a `.md` file. Everything in the file is prose as far as the rule is
# concerned, including command examples.
# Placed AFTER the general recipe section on purpose. Vale precedence here is
# positional and a later matcher wins, which `create-vale-rule` documents at
# step 2, so an exclusion that sits above the rule it narrows is relying on
# something the repository's own recipe says is not true. Measured on 3.18.0
# both orders currently exclude these two files, so this is robustness rather
# than a bug fix: it costs nothing and stops depending on which of the two
# behaviours Vale actually implements.
#
# `create-vale-rule` and `verify-rule` teach rule authoring THROUGH a worked
# example called `no-simply`, so the token appears dozens of times as an
# identifier and as sample output rather than as hedging. Vale cannot tell a
# word being used from a word being quoted.
#
# THEY ARE NO LONGER EXCLUDED. Both were, wholesale, which cost 33 findings of
# coverage on two of the largest recipes to silence a single worked example.
# Now that a recipe is markdown, `<!-- vale no-hedging.no-hedging = NO -->`
# marks the example itself and the rest of each file is checked. Measured: the
# exclusion suppressed 33 hits, the regions suppress the same ones, and the
# prose around them is now covered where it was not.
#
# The markers never reach a reader. `stripValeDirectives` in
# `src/prompts/recipes.ts` removes them at render, and a test asserts no served
# recipe contains one.

[**/test/fixtures/**/README.md]
tskl) rule = no-hedging
BasedOnStyles =
no-hedging.no-hedging = NO
