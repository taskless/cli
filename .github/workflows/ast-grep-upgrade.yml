# SPDX-License-Identifier: MIT
# ast-grep — notice upstream releases, and open the pin bump with the changelog in it.
#
# WHY THIS EXISTS. Vale's upstream releases have been watched by a machine since
# the platform packages were built. ast-grep had `sg-detect.cjs` but nowhere for
# its answer to go: the only consumer was the README badge, which renders a
# version and cannot render a changelog. So "ast-grep 0.45.3 is out" was
# discoverable only by someone noticing a number on a badge and then going to
# find the release notes by hand — and 0.45.3 duly sat unpinned with nothing
# reporting it.
#
# WHY IT OPENS A PULL REQUEST, having previously argued for not writing at all.
# `sg-detect.cjs` used to refuse to write on the grounds that a lockfile-touching
# bump belongs to a human. Half of that was right and is unchanged: nobody
# merges this unread, and `Validate` runs on it like any other pull request.
# The other half was wrong. Refusing to write does not cause anyone to review
# anything — it only meant nothing was ever proposed. A reviewed pull request is
# more review than no pull request.
#
# HOW THIS DIFFERS FROM release-vale.yml's detect, which it otherwise mirrors:
#
#   - There is no trust boundary here, so there is no second phase. Vale's
#     detect proposes DIGESTS that authorize a later job to download and publish
#     third-party bytes, which is why reviewing it is load-bearing and why the
#     publish is split into a separate credential-free fetch. This proposes a
#     version string. npm verifies its own integrity through the lockfile, and
#     nothing here publishes anything.
#
#   - The lockfile is regenerated rather than hand-edited. `pnpm install
#     --lockfile-only` resolves the eight platform packages at the new version
#     and rewrites `pnpm-lock.yaml`. It fails if upstream published the CLI
#     without one of its platform siblings, which is the failure worth catching
#     before a reviewer sees it, not after.
#
#   - A changeset is written, where Vale's detect labels `skip-changeset`. The
#     Vale packages are stamped by their own pipeline and reach a consumer only
#     when a pin is bumped; THIS is that bump, and it changes which ast-grep a
#     `@taskless/cli` user runs. `patch`, because the package is pre-1.0 — see
#     the bump guidance in CLAUDE.md before reaching for `minor`.
#
# THE BOT COMMIT IS SELF-CONSISTENT, AND CHECKED BEFORE IT IS PUSHED.
# `AST_GREP_VERSION` in packages/cli/src/rules/capabilities.ts is maintained by
# hand and test/engine-version-consistency.test.ts holds it to the pins
# (deliberately — read that test's docblock before deriving the constant from
# package.json), and src/generated/ast-grep-rule-schema.json is fetched from
# upstream by tag. A commit that moved only the pins failed Validate BY
# CONSTRUCTION; vale-upgrade.yml measured it on #368/#372, and this workflow
# had the same shape. So `--write` moves the constant with the pins, the rule
# schema is refetched for the new tag, and the consistency check runs here,
# before `vendor-pr.cjs` pushes. If it fails, the run fails and nothing is
# proposed: pushing an inconsistent commit is the thing being removed. What
# stays for a human child pull request is judgment, not bookkeeping: the
# measured additions to ast-grep-vendor-contract.test.ts, the `update` ledger,
# and the changeset prose. That contract test is NOT gated here, on purpose:
# see the check step.
#
# ONE ROLLING BRANCH, `vendor/ast-grep/upgrade`. `vendor-pr.cjs` owns that
# lifecycle for every vendor workflow — rebuild from `main`, retitle and rewrite
# as upstream moves, and force-push only when the proposal changed and only when
# this workflow wrote what is already on the branch.
#
# THE `/upgrade` SUFFIX IS NOT DECORATION, even though ast-grep has only the one
# stage. Git refs are paths, so a branch named `vendor/ast-grep` is a FILE at
# that path and makes `vendor/ast-grep/<anything>` impossible to create ever
# after. Vale needed exactly that split — `vendor/vale/republish` for the
# packages we build and `vendor/vale/upgrade` for the pins a user gets — and
# reserving the namespace here costs one word. That Vale has a `republish` and
# ast-grep does not is the real difference between them: nothing in this
# repository repackages ast-grep, so there is no set of our own to publish
# before the pins can move.
#
# Action refs are pinned to commit SHAs; the trailing comment records the tag.

name: Upgrade ast-grep

on:
  # Same cadence and the same reasoning as the Vale detect: upstream's release
  # rhythm, not ours. The dispatch covers "upstream just released, do not wait
  # until Monday".
  schedule:
    - cron: "41 7 * * 1"

  workflow_dispatch:

permissions: {}

concurrency: ast-grep-upgrade

jobs:
  detect:
    name: Upgrade the pinned ast-grep
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the vendor/ast-grep/upgrade branch
      pull-requests: write # open the bump PR
    steps:
      # Credentials persist because this job pushes a branch. It holds no npm
      # identity and no id-token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # No dependency install yet: sg-detect.cjs is zero-dependency CommonJS,
      # and the install below has to come AFTER the bump so it resolves the
      # new pins.
      #
      # `--write` moves the eight pins and `AST_GREP_VERSION` in
      # capabilities.ts together, and fails the run if the declaration is not
      # found exactly once.
      #
      # `--notes-out` writes upstream's release notes to a FILE rather than to a
      # step output, because they are third-party Markdown and a $GITHUB_OUTPUT
      # line is delimited text that a release body containing the delimiter can
      # break out of. It reaches the body through `--body-file` and never meets
      # a shell or a `${{ }}` expression.
      - id: detect
        run: |
          node .github/scripts/sg-detect.cjs \
            --write --notes-out "${RUNNER_TEMP}/sg-release-notes.md"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Resolution, not editing. `--lockfile-only` skips linking, so nothing is
      # downloaded into node_modules and no lifecycle script runs; the job's
      # only product is a rewritten pnpm-lock.yaml. It fails if the eight
      # platform packages are not all published at the new version.
      - name: Regenerate the lockfile
        if: steps.detect.outputs.update == 'true'
        run: pnpm install --lockfile-only --ignore-scripts

      # A real install this time, because the schema refetch and the check
      # below run under the package's toolchain, and the check spawns the NEW
      # ast-grep. Under CI pnpm applies `--frozen-lockfile` on its own, and the
      # lockfile rewritten one step ago satisfies it — a third check that
      # resolution matched the pins. Still a registry-only install under the
      # default GITHUB_TOKEN, with no NODE_AUTH_TOKEN and no npm identity; the
      # root `postinstall` skips itself under CI.
      - name: Install
        if: steps.detect.outputs.update == 'true'
        run: pnpm install

      # The rule schema is upstream's, fetched by the tag the new pin names
      # (raw.githubusercontent.com, the same network this job already uses for
      # the release notes). The generator reads the version from the bumped
      # package.json, and writes no timestamp, so a rerun against an unchanged
      # upstream leaves the tree unchanged and `vendor-pr.cjs` stays inert.
      - name: Regenerate the ast-grep rule schema
        if: steps.detect.outputs.update == 'true'
        run: pnpm --filter @taskless/cli generate:ast-grep-schema

      # The consistency check Validate would run, before anything is pushed. It
      # imports source directly and needs no build: it holds the constant to
      # the pins and spawns the pinned binary to confirm it reports that
      # version. A failure here is a bookkeeping defect in this job's own
      # output, so the run fails and proposes nothing.
      #
      # Deliberately ONLY that test. ast-grep-vendor-contract.test.ts holds the
      # language list and a set of measured behaviours to the binary, and a new
      # ast-grep that adds a language or changes a behaviour fails it —
      # correctly, and the fix is a measured edit that belongs in the child
      # pull request. Gated here, that signal would become a scheduled run
      # failing every Monday with no pull request and no changelog to read;
      # left to Validate, it is a red check on a pull request that already
      # carries upstream's notes. (Measured: rewinding the pin to 0.45.2 through
      # these exact steps passed engine-version-consistency and failed four
      # behaviours the contract recorded at 0.45.3.)
      - name: Check the bump is self-consistent
        if: steps.detect.outputs.update == 'true'
        run: >-
          pnpm --filter @taskless/cli test --project cli
          engine-version-consistency

      # "upgrade to", the same verb vale-upgrade.yml uses, because it is the
      # same operation: moving the pins a user resolves. ast-grep has no
      # "accept upstream" counterpart, since nothing here repackages it.
      #
      # Every value reaching the shell goes through `env:` rather than `${{ }}`
      # interpolation into the script body. The branch and pull request
      # lifecycle is `vendor-pr.cjs`, shared with release-vale.yml.
      - name: Propose the bump
        if: steps.detect.outputs.update == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SG_VERSION: ${{ steps.detect.outputs.sg_version }}
          PINNED_VERSION: ${{ steps.detect.outputs.pinned_version }}
        run: |
          set -euo pipefail

          # A changeset, because this bump is what reaches a consumer — unlike
          # the Vale manifest, whose packages are stamped by their own pipeline
          # and reach nobody until a pin like this one moves. `patch` is correct
          # while @taskless/cli is pre-1.0 even though the diff adds no surface
          # of our own; see the bump guidance in CLAUDE.md before reaching for
          # `minor`. The filename carries the version so that two different
          # bumps never share a release note. Accumulation is not what stops
          # here — `vendor-pr.cjs` rebuilds the branch from `main` every run,
          # so only ever one changeset file exists on it regardless of the
          # name.
          changeset=".changeset/ast-grep-${SG_VERSION//./-}.md"
          cat > "$changeset" <<CHANGESET
          ---
          "@taskless/cli": patch
          ---

          Update the bundled ast-grep to ${SG_VERSION} (from ${PINNED_VERSION}).
          CHANGESET

          # Composed as a FILE, not as an argument. The preamble is ours and the
          # notes appended below it are upstream's, and the quoted heredoc plus
          # `cat` means neither the shell nor gh ever interprets the latter.
          body="${RUNNER_TEMP}/sg-pr-body.md"
          cat > "$body" <<BODY
          Upstream ast-grep is ahead of the version this repository pins.

          This moves every \`@ast-grep/cli*\` pin in \`packages/cli/package.json\`
          from \`${PINNED_VERSION}\` to \`${SG_VERSION}\` and regenerates
          \`pnpm-lock.yaml\`. The pins move **together** on purpose: the platform
          packages are selected by optional dependency, so a straggler left at
          the old version is a different ast-grep on one platform than on the
          others. \`sg-detect.cjs\` fails the run rather than open a partial bump.

          The rewrite replaces a version string in pins it can already
          enumerate and refuses if the count does not match, so it cannot add a
          dependency or reformat the file. It also moves \`AST_GREP_VERSION\` in
          \`capabilities.ts\` and refetches \`src/generated/ast-grep-rule-schema.json\`
          for the ${SG_VERSION} tag, and the workflow ran
          \`engine-version-consistency\` against the result before pushing. What
          this does **not** carry is judgment: if \`ast-grep-vendor-contract\`
          is red on this pull request, ast-grep ${SG_VERSION} added a language
          or changed a measured behaviour, and that edit, the \`update\` ledger,
          and the release note's prose belong in a child pull request.

          This pull request rolls: if upstream releases again before it merges,
          the branch, title, and body are rewritten to the newer version rather
          than a second pull request being opened. Push a commit to the branch
          and that stops — the workflow will not force-push over a commit it did
          not write.
          BODY

          # Absent only if the detect step reported ahead and then wrote no
          # notes, which it cannot — so warn rather than skip silently.
          notes="${RUNNER_TEMP}/sg-release-notes.md"
          if [ -f "$notes" ]; then
            printf '\n---\n\n' >> "$body"
            cat "$notes" >> "$body"
          else
            echo "::warning::no release notes file at ${notes}"
          fi

          node .github/scripts/vendor-pr.cjs \
            --branch vendor/ast-grep/upgrade \
            --title "chore(ast-grep): upgrade to ast-grep ${SG_VERSION}" \
            --message "chore(ast-grep): upgrade to ast-grep ${SG_VERSION}" \
            --body-file "$body" \
            -- packages/cli/package.json pnpm-lock.yaml "$changeset" \
               packages/cli/src/rules/capabilities.ts \
               packages/cli/src/generated/ast-grep-rule-schema.json
