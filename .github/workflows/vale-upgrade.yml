# SPDX-License-Identifier: MIT
# Vale — ship the platform packages we already published.
#
# THE STAGE THAT WAS MISSING. Vendoring Vale has two halves, and until now only
# one of them was automated:
#
#   republish   release-vale.yml. Watches upstream Vale, proposes a manifest
#               with new digests on `vendor/vale/republish`, and on merge
#               publishes the six @taskless/vale-* packages at
#               <valeVersion>-<stamp>. Changes nothing for a consumer.
#
#   upgrade     this workflow. Moves the six pins in packages/cli/package.json
#               to the published set on `vendor/vale/upgrade`. THIS is what
#               reaches a user.
#
# release-vale.yml states the dependency in its own header: "a new version
# reaches a user only when someone reviews a bump to that pin". Somebody always
# did — `git log` on the pins shows 3.18.0, 3.19.0 and 3.20.0 each moved in its
# own hand-written commit, and the pins are current as this is written. So this
# automates a step that was working, which is worth being honest about: what it
# removes is the dependency on remembering, and what it adds is the changelog
# next to the diff. The failure it prevents is quiet — a publish lands, nobody
# notices the pins are behind, and the release simply does not ship.
#
# ast-grep has only the upgrade half, because nothing here repackages it; there
# is no `vendor/ast-grep/republish` and its absence is the point. Beyond that
# the two upgrades are the same operation, and they share the same scripts:
# `pin-bump.cjs` rewrites the pins, `release-notes.cjs` renders the changelog,
# and `vendor-pr.cjs` owns the rolling branch and its force-push guards. What
# differs is which registry answers "what is published" and which tag carries
# the release notes.
#
# THE CHANGELOG HERE IS UPSTREAM'S, NOT OURS. Our stamp records when a package
# was built, which tells a reviewer nothing about what changed. The base version
# inside the stamp is the release upstream actually tagged, and that is what
# gets fetched.
#
# Action refs are pinned to commit SHAs; the trailing comment records the tag.

name: Upgrade Vale

on:
  # THE MANIFEST COMMIT, not a clock. The only event that makes the pins fall
  # behind is a republish, and a republish starts exactly when a reviewed
  # manifest change lands on main — the merge of a release-vale.yml detect pull
  # request. This is the same trigger release-vale.yml publishes on, so the two
  # halves start from the same commit rather than this one polling for the
  # other's result.
  #
  # Starting together is also the race. release-vale.yml has to fetch, verify,
  # pack, and publish six packages before the registry can answer "what is
  # published" with the new set, and the detect step below asks the registry.
  # Measured on 3.22.0: the manifest merged at 18:09:13Z, the publish run
  # started three seconds later, the packages were stamped 18:09:30 — and a run
  # of this workflow started at 18:09 would have compared the pins against the
  # OLD latest, found nothing to do, and exited clean. The two wait steps
  # before detect exist for that: the first holds until the `Release Vale` run
  # for this same commit has concluded, the second holds until the registry
  # actually serves a newer set. Neither can fail the run; see below.
  push:
    branches: [main]
    paths:
      - ".github/scripts/vale-manifest.json"

  # A BACKSTOP, not the trigger. Before the push trigger above existed, this
  # daily cron was the only thing that noticed a publish, and on 3.22.0 it
  # noticed thirteen hours after the packages were on npm. Now it covers the
  # cases the push run cannot: a publish that failed and was re-run by hand
  # (a re-run is not a new push, so nothing above fires), and registry
  # propagation slower than the wait below is willing to sit through. A push
  # run that gives up says so in a warning and leaves the work to this.
  schedule:
    - cron: "52 7 * * *"

  workflow_dispatch:

permissions: {}

concurrency: vale-upgrade

jobs:
  upgrade:
    name: Upgrade the pinned Vale
    runs-on: ubuntu-latest
    permissions:
      actions: read # wait on the Release Vale run for this commit
      contents: write # push the vendor/vale/upgrade branch
      pull-requests: write # open the upgrade PR
    steps:
      # Credentials persist because this job pushes a branch. It holds no npm
      # identity and no id-token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # THE PUBLISH RACE, first half. On a push this run and the `Release Vale`
      # run for the same commit started within seconds of each other, and the
      # registry cannot serve packages that have not been published yet. Hold
      # until that run has concluded, polling every 30 s for up to 25 minutes
      # (on 3.22.0 the run had stamped the packages 14 s after it started; the
      # bound is for a queued runner, not for the work).
      #
      # EVERY EXIT HERE IS 0. A run that concludes anything but success, or
      # that never appears inside the bound, is a warning and a clean exit,
      # never a failed check: this workflow must not go red over a race it did
      # not cause, and a red here would say "the upgrade is broken" when the
      # truth is "the publish is". The daily schedule above retries once the
      # packages are actually there, which is what a backstop is for.
      #
      # Only on `push`. A scheduled or dispatched run has no publish to wait
      # for — its commit is whatever main is, and the run list for that commit
      # is empty by construction — so waiting there would only burn the bound.
      # `--commit` is exact, so a publish run for a DIFFERENT manifest commit
      # (an earlier release still draining) is never mistaken for this one.
      - name: Wait for the Release Vale run for this commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          deadline=$(( SECONDS + 25 * 60 ))
          while :; do
            # Two fields, tab-separated, one line per run. Empty until the run
            # is registered, which can lag the push by a few seconds.
            #
            # `|| runs=""` is load-bearing under `set -e`: a plain assignment
            # from a command substitution is NOT one of errexit's exempt
            # contexts, so without it one rate-limited or 5xx'd `gh` call in
            # fifty polls would abort the step and turn the run red — the one
            # outcome this step exists to rule out. A failed call is treated
            # exactly like "not yet registered" and polled again.
            runs="$(gh run list \
              --workflow release-vale.yml \
              --event push \
              --commit "$GITHUB_SHA" \
              --json status,conclusion \
              --jq '.[] | [.status, .conclusion] | @tsv')" || runs=""

            if [ -n "$runs" ] && ! grep -qv $'^completed\t' <<< "$runs"; then
              if grep -qv $'\tsuccess$' <<< "$runs"; then
                echo "::warning::the Release Vale run for ${GITHUB_SHA} did not succeed (${runs//$'\n'/; }); nothing to upgrade to yet. The daily schedule will retry once a publish lands."
                exit 0
              fi
              echo "Release Vale succeeded for ${GITHUB_SHA}."
              break
            fi

            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::warning::gave up waiting for the Release Vale run for ${GITHUB_SHA} after 25 minutes (${runs:-no run found}). The daily schedule will retry."
              exit 0
            fi
            echo "Release Vale for ${GITHUB_SHA}: ${runs:-not yet registered}; retrying in 30 s."
            sleep 30
          done

      # THE PUBLISH RACE, second half. `npm publish` returning is not the same
      # as the registry's packument for the name serving the new dist-tag; that
      # propagates, usually in seconds, occasionally longer. Ask the registry
      # the exact question the detect step is about to ask, with the same
      # script and no side effects, and give it a few minutes to say yes. Like
      # the step above this cannot fail the run: if the registry still says
      # "current" at the end, the detect step will say the same, do nothing,
      # and the daily schedule picks it up.
      #
      # `--json` alone, no `--write` and no `--notes-out`; the script refuses
      # that combination for exactly this use, a read that changes nothing.
      #
      # A probe that ERRORS is kept apart from a probe that answers "current".
      # The script prints its error to stderr and nothing to stdout, so a bare
      # grep on stdout would read a registry outage as "still the old version"
      # and the closing warning would then blame propagation for something
      # else. Each outcome is logged as what it was, and the closing warning
      # claims only what was observed. An error that persists is not this
      # step's to report: the detect step runs the same code next and fails
      # loudly on it, which is right — a broken registry read is a real
      # failure, not the race.
      - name: Wait for the registry to serve the new set
        if: github.event_name == 'push'
        run: |
          set -euo pipefail

          for attempt in 1 2 3 4 5; do
            if comparison="$(node .github/scripts/vale-upgrade-detect.cjs --json)"; then
              if grep -q '"ahead":true' <<< "$comparison"; then
                echo "The registry serves a newer set than the pins: ${comparison}"
                exit 0
              fi
              echo "The registry still serves the pinned version (attempt ${attempt} of 5): ${comparison}"
            else
              echo "The registry probe failed (attempt ${attempt} of 5); see the error above."
            fi
            echo "Retrying in 60 s."
            sleep 60
          done
          echo "::warning::no probe in five minutes after the publish succeeded reported a newer set than the pins; each attempt is logged above with its result. The daily schedule will retry."

      # No dependency install: the script is zero-dependency CommonJS, and the
      # lockfile step below needs pnpm rather than node_modules. GITHUB_TOKEN is
      # only for the rate limit on the release-notes lookup.
      #
      # `--notes-out` writes third-party Markdown to a FILE rather than a step
      # output, because a $GITHUB_OUTPUT line is delimited text that a release
      # body containing the delimiter can break out of.
      - id: detect
        run: |
          node .github/scripts/vale-upgrade-detect.cjs \
            --write --notes-out "${RUNNER_TEMP}/vale-release-notes.md"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Resolution, not editing. `--lockfile-only` skips linking, so nothing is
      # downloaded and no lifecycle script runs. It fails if the six packages
      # are not all resolvable at the new version — a second, independent check
      # on the half-published set the detect step already refuses.
      - name: Regenerate the lockfile
        if: steps.detect.outputs.update == 'true'
        run: pnpm install --lockfile-only --ignore-scripts

      - name: Propose the upgrade
        if: steps.detect.outputs.update == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALE_VERSION: ${{ steps.detect.outputs.vale_version }}
          BASE_VERSION: ${{ steps.detect.outputs.base_version }}
          PINNED_VERSION: ${{ steps.detect.outputs.pinned_version }}
        run: |
          set -euo pipefail

          # A changeset, because this is the bump a consumer experiences — the
          # republish that produced the package did not change anyone's install.
          # `patch` is correct while @taskless/cli is pre-1.0 even for a new Vale
          # minor; see the bump guidance in CLAUDE.md before reaching for
          # `minor`. Named for the BASE version, not the stamped one: a
          # republish mints a fresh timestamp for the same upstream Vale, so a
          # stamped filename would churn on every republish while the release
          # note it contains says the same thing. The base version is also what
          # the title, the body, and the note itself say.
          changeset=".changeset/vale-${BASE_VERSION//./-}.md"
          cat > "$changeset" <<CHANGESET
          ---
          "@taskless/cli": patch
          ---

          Update the bundled Vale to ${BASE_VERSION}.
          CHANGESET

          # Composed as a FILE, not as an argument. The preamble is ours and the
          # notes appended below it are upstream's, and the quoted heredoc plus
          # `cat` means neither the shell nor gh ever interprets the latter.
          body="${RUNNER_TEMP}/vale-upgrade-body.md"
          cat > "$body" <<BODY
          The \`@taskless/vale-*\` packages are published ahead of what
          \`@taskless/cli\` pins.

          This moves all six pins from \`${PINNED_VERSION}\` to
          \`${VALE_VERSION}\` — Vale **${BASE_VERSION}** — and regenerates
          \`pnpm-lock.yaml\`. The pins move **together** on purpose: the platform
          packages are selected by optional dependency, so a straggler left at
          the old version is a different Vale on one platform than on the others.

          **This is the half that reaches a user.** Republishing the platform
          packages changes nobody's install, because the CLI pins each one
          exactly; merging this is what ships the new Vale.

          This pull request rolls: if another set is published before it merges,
          the branch, title, and body are rewritten to the newer version rather
          than a second pull request being opened. Push a commit to the branch
          and that stops — the workflow will not force-push over a commit it did
          not write.
          BODY

          # Absent only if the detect step reported ahead and then wrote no
          # notes, which it cannot — so warn rather than skip silently.
          notes="${RUNNER_TEMP}/vale-release-notes.md"
          if [ -f "$notes" ]; then
            printf '\n---\n\n' >> "$body"
            cat "$notes" >> "$body"
          else
            echo "::warning::no release notes file at ${notes}"
          fi

          node .github/scripts/vendor-pr.cjs \
            --branch vendor/vale/upgrade \
            --title "chore(vale): upgrade to Vale ${BASE_VERSION}" \
            --message "chore(vale): upgrade to Vale ${BASE_VERSION}" \
            --body-file "$body" \
            -- packages/cli/package.json pnpm-lock.yaml "$changeset"
