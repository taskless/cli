name: OpenSpec Sweep

# A scheduled backstop for the case where the push-time check was never
# evaluated: an administrative merge, a workflow disabled during an outage, a
# botched down-merge.
#
# IT IS NOT A SECOND CLASSIFIER. `openspec-rot.yml`, deleted in 8d1f3a1, split
# changes into DONE (all tasks checked) and STALE (unfinished and idle) so it
# could guess whether unfinished work was abandoned or merely slow. That guess
# is what made it noisy. There is no parked state on `main`: a change is
# finished or it has not landed. So this reads age and nothing else, parses no
# `tasks.md`, and treats a half-done change exactly like a finished one.
#
# AGE COMES FROM GIT, NEVER FROM FILE MTIME. `actions/checkout` stamps every
# file's modification time to checkout time, so an mtime-based sweep reports
# every change as fresh regardless of how long it has sat there. The deleted
# workflow got this right and the note is worth keeping.
#
# AGE IS ACTIVITY, WHICH IS WHY THE CLAIM TEST IS NOT NEEDED HERE. A stack still
# draining touches its own change directory on every slice, so its clock keeps
# resetting and it never crosses the window. Only stalled work does.
#
# IT DOES NOT FAIL EITHER. The predecessor failed the scheduled run, which is
# the same channel mistake in a quieter place: a recurring red attached to
# nothing actionable. This escalates the tracking issue that
# `openspec-tracking.yml` owns, so there is one channel and one place to look.

on:
  schedule:
    # Daily near the start of the Pacific business day. Cron is fixed-UTC and
    # does not follow DST, so 15:17 UTC lands at 8:17am PDT and 7:17am PST.
    # The :17 is off the top of the hour, which GitHub delays under contention.
    - cron: "17 15 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  STALE_DAYS: "7"

jobs:
  sweep:
    name: OpenSpec Sweep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history, so `git log` can date each change directory

      - name: Plan escalations
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          LABEL: Open OpenSpec
        run: |
          set -euo pipefail

          unarchived='[]'
          now=$(date +%s)
          # The listing is delegated to openspec-tracking.cjs --list rather
          # than to a shell `find`. This file once carried `find ... -printf
          # '%f\n'` inside a process substitution: `done < <(...)` hands the
          # loop the substitution's own exit status, not find's, so a failed
          # `-printf` on BSD find (macOS) ran the loop zero times and this
          # step silently reported "0 unarchived changes" and exited 0. That
          # is the exact silent case this workflow exists to avoid, and a
          # different `find` form only fixes this one occurrence of it.
          # Routing the listing through `readdirSync`, already covered by
          # openspec-tracking.test.cjs, removes the question of which `find`
          # flags are portable rather than answering it correctly once. The
          # script's own exit status is captured by a plain assignment, not a
          # process substitution, so its failure cannot go unseen the same way.
          if ! changes_json=$(node .github/scripts/openspec-tracking.cjs --list 2>&1); then
            echo "::warning::Could not list openspec/changes/ ($changes_json). Reporting zero unarchived changes would be wrong; skipping the sweep for this run instead."
          else
            # Names and ages go into JSON as jq ARGUMENTS, never joined into a
            # line and split back apart. A directory name containing a space
            # desynced the split, `tonumber` threw on the wrong field, and under
            # `set -euo pipefail` that failed the whole run: the "signal expected
            # to be red" failure this workflow exists to avoid. Nothing enforces
            # kebab-case directory names, so the encoding must not assume it.
            while IFS= read -r name; do
              [ -z "$name" ] && continue
              # The last commit that touched this change directory. A directory
              # with no commits at all is treated as brand new rather than
              # infinitely old, so a checkout quirk cannot manufacture a report.
              last=$(git log -1 --format=%ct -- "openspec/changes/$name" || true)
              if [ -z "$last" ]; then
                age=0
              else
                age=$(( (now - last) / 86400 ))
              fi
              unarchived=$(jq -c --arg name "$name" --argjson age "$age" \
                '. + [{name: $name, ageDays: $age}]' <<<"$unarchived")
            done < <(jq -r '.[]' <<<"$changes_json")
          fi

          # Bodies are handed over raw. The marker is parsed in one place, in
          # openspec-tracking.cjs, rather than re-implemented as a `jq capture`
          # here and in openspec-tracking.yml: `capture` drops a non-matching
          # element from the array instead of erroring, so a body that stopped
          # matching would read as "no issue exists" and open a duplicate.
          #
          # `idleDays` throttles escalation to at most one comment per window.
          issues=$(gh issue list --repo "$REPO" --state all --label "$LABEL" --limit 100 \
            --json number,state,body,updatedAt \
            | jq -c --argjson now "$(date +%s)" \
                '[.[] | {
                   number,
                   state: (.state | ascii_downcase),
                   body: (.body // ""),
                   idleDays: (($now - (.updatedAt | fromdateiso8601)) / 86400 | floor)
                 }]')

          jq -n -c \
            --arg sha "$SHA" \
            --argjson staleDays "$STALE_DAYS" \
            --argjson unarchived "$unarchived" \
            --argjson issues "$issues" \
            '{mode: "sweep", sha: $sha, staleDays: $staleDays, unarchived: $unarchived, issues: $issues}' \
            > /tmp/openspec-sweep-input.json

          node .github/scripts/openspec-tracking.cjs \
            < /tmp/openspec-sweep-input.json \
            > /tmp/openspec-sweep-plan.json

          cat /tmp/openspec-sweep-plan.json

      - name: Apply the plan
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          LABEL: Open OpenSpec
        run: |
          set -euo pipefail

          count=$(jq '.actions | length' /tmp/openspec-sweep-plan.json)
          echo "Applying $count action(s)."

          for index in $(seq 0 $((count - 1))); do
            action=$(jq -c ".actions[$index]" /tmp/openspec-sweep-plan.json)
            type=$(jq -r '.type' <<<"$action")
            change=$(jq -r '.change' <<<"$action")
            number=$(jq -r '.issue // ""' <<<"$action")

            case "$type" in
              open)
                gh issue create --repo "$REPO" --label "$LABEL" \
                  --title "$(jq -r '.title' <<<"$action")" \
                  --body "$(jq -r '.body' <<<"$action")" \
                  || echo "::notice::Could not open a tracking issue for $change."
                ;;
              escalate)
                gh issue comment "$number" --repo "$REPO" \
                  --body "$(jq -r '.comment' <<<"$action")" \
                  || echo "::notice::Could not comment on issue $number for $change."
                ;;
              close)
                gh issue close "$number" --repo "$REPO" \
                  --comment "$(jq -r '.comment' <<<"$action")" \
                  || echo "::notice::Could not close issue $number for $change."
                ;;
              *)
                echo "::notice::Unhandled action '$type' for $change."
                ;;
            esac
          done
