# Pins what the `create-legacy-rule` recipes say about Ruff, pylint, flake8,
# and Biome, by asking each linter at a pinned version. See
# `packages/cli/test/legacy-linter-vendor-contract.test.ts`.
#
# Separate from `Validate` on purpose: it downloads linters from PyPI and npm,
# and a registry outage must not block every merge. A red run here means a
# recipe sentence stopped being true, or a pinned version moved.
name: Legacy linter contract

on:
  # No `branches:` filter, for the reason `validate.yml` gives.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "packages/cli/src/agent/create-legacy-rule*.md"
      - "packages/cli/test/legacy-linter-vendor-contract.test.ts"
      - ".github/workflows/legacy-linter-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  TASKLESS_TELEMETRY_DISABLED: "1"

jobs:
  contract:
    name: Legacy linter contract
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        working-directory: packages/cli
        env:
          TASKLESS_LEGACY_LINTER_CONTRACT: "1"
        run: pnpm vitest run test/legacy-linter-vendor-contract.test.ts
