# The dogfood shape: three matchers, and the trailing .taskless/** block
# that check never needs.
[*.md]
tskl) rule = no-simply
BasedOnStyles =
no-simply.no-simply = YES

[2024/**]
tskl) rule = no-simply
no-simply.no-simply = NO

[docs/[a-z]*.md]
tskl) rule = no-simply
BasedOnStyles =
no-simply.no-simply = YES

[.taskless/**]
tskl) rule = no-simply
no-simply.no-simply = NO
